# -------------------------------------------------------------
# 1. REAL IP EXTRACTION (Required behind Traefik / CloudFront)
# -------------------------------------------------------------
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# -------------------------------------------------------------
# 2. DEFINE RATE & CONNECTION LIMIT ZONES
# -------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=global_req_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=global_conn_limit:10m;
limit_req_zone $binary_remote_addr zone=auth_req_limit:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # Loads the blocklist mounted into /etc/nginx/conf.d/blocklist.conf
    include /etc/nginx/conf.d/blocklist.conf;

    client_max_body_size 100M;

    limit_req_status 429;
    limit_conn_status 429;

    limit_conn global_conn_limit 15;

    # -------------------------------------------------------------
    # 3. EXEMPT LET'S ENCRYPT ACME CHALLENGES
    # -------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # -------------------------------------------------------------
    # 4. BLOCK HIDDEN FILES
    # -------------------------------------------------------------
    location ~ /\. {
        return 444;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------
    # 5. DROP EXPLICIT SCANNER FILE EXTENSIONS
    # -------------------------------------------------------------
    location ~* \.(php|php5|phtml|asp|aspx|jsp|cgi|env|bak|swp|git|ini|log|conf|orig|save|dist)$ {
        return 444;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------
    # 6. BLOCK KNOWN BOT & CMS PROBE PATHS
    # -------------------------------------------------------------
    location ~* ^/(wp-admin|wp-includes|wp-json|wp-content|wp-login|squirrelmail|roundcube|webmail|gogs) {
        return 444;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------
    # 7. STATIC ASSETS
    # -------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # -------------------------------------------------------------
    # 8. STRICT RATE LIMITING ON AUTH & SENSITIVE ENDPOINTS
    # -------------------------------------------------------------
    location ~* ^/(login|signup|generate-prt|reset-password)/ {
        limit_req zone=auth_req_limit burst=5 nodelay;

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header CloudFront-Viewer-Address $http_cloudfront_viewer_address;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }

    # -------------------------------------------------------------
    # 9. DYNAMIC REQUEST PROXY (Django / uWSGI)
    # -------------------------------------------------------------
    location / {
        limit_req zone=global_req_limit burst=20 nodelay;

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header CloudFront-Viewer-Address $http_cloudfront_viewer_address;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}