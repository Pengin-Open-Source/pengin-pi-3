<!-- components/divider.html -->
<div style="width: 100%; background-color: transparent !important; clear: both; display: block;" aria-hidden="true">
    <!-- Top Space (20px) and Top Line (2px) -->
    <div style="border-top: 2px solid #5a5a5a; width: 100%;"></div>
    
    <!-- Center Line (3px) separated by 5px space above and below it -->
    <div style="border-top: 3px solid #1A6C9B; width: 100%; margin-bottom: 20px;"></div>
    
    <!-- Bottom Line (2px) and Bottom Space (20px) -->
    <div style="border-top: 3px solid #1A6C9B; width: 100%; margin-top: 20px;"></div>
    <div style="border-top: 2px solid #5a5a5a; width: 100%;"></div>

</div>
