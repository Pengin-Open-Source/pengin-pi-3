{% extends "layouts/centered-card-form.html" %}

{% block top_left %}
    <a href="{% url 'events:calendar' %}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="fas fa-arrow-left"></i>
    </a>
    <h1 class="h3 fw-bold text-secondary m-0">Calendar Settings</h1>
{% endblock %}

{% block middle_article %}
    <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
            <label class="form-label small fw-bold text-secondary mb-1">{{ form.first_day_of_week.label }}</label>
            {{ form.first_day_of_week }}
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4 shadow-sm fw-semibold">
                <i class="fas fa-save me-1"></i> Save
            </button>
            <a href="{% url 'events:calendar' %}" class="btn btn-outline-secondary px-3">Cancel</a>
        </div>
    </form>
{% endblock %}
