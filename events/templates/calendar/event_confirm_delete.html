{% extends "layout/no_contact.html" %}

{% block pageContent %}
<section class="page-section bg-light text-dark mb-0 py-5">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 text-center p-4">
        <div class="card-body">
          <div class="mb-3 text-danger">
            <i class="bi bi-exclamation-triangle-fill display-1"></i>
          </div>
          <h1 class="h4 card-title fw-bold mb-3">Delete Event?</h1>
          <p class="card-text text-muted mb-4">
            Are you sure you want to delete <strong>{{ event.title }}</strong>? This cannot be undone.
          </p>
          <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-danger fw-semibold">Delete Event</button>
              <a href="{% url 'events:event_detail' event.id %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
{% endblock %}
