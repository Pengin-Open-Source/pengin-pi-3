[Definition]
# Regex matches standard Nginx access logs for 404, 429, or 444 status codes
# - 444 is what nginx.conf's own hidden-file/scanner-extension/CMS-probe
# rules return, so this is what actually converts those blocks into bans.
failregex = ^<HOST> -.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS).* HTTP/.*" (404|429|444)
ignoreregex =
